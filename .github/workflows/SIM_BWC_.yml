name: Android Nuclear Clean CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      # Step 1: NUKE everything (except .git folder to preserve repo)
      - name: 🔥 Nuclear Clean Workspace
        run: |
          echo "⚠️ WARNING: DELETING EVERYTHING IN WORKSPACE ⚠️"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          echo "Workspace nuked. Re-checking out code..."

      # Step 2: Fresh checkout
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full git history

      # Step 3: Clean any remaining Gradle caches
      - name: Purge Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf $GRADLE_USER_HOME/caches/

      # Rest of your build steps...
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cache: false
          cmdline-tools-version: 'latest'
          build-tools-version: '34.0.0'
          platform-version: '34'
          ndk-version: '25.2.9519653'

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace --no-daemon

      - name: List Generated APK Files
        run: ls -l app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BWCTrans-debug
          path: app/build/outputs/apk/debug/app-debug.apk
